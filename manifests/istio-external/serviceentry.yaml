# 外部宛先を Kiali / ztunnel のメトリクスで名前付きにするためだけに置き、通信は制限しない。
# addresses を書かず istiod の自動割り当て VIP と ztunnel の DNS キャプチャで宛先を識別させる。
# exportTo は ztunnel には効かないが、ingress gateway の Envoy に不要な cluster を配らないため付ける。
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: kind-registry
spec:
  exportTo:
  - "."
  hosts:
  - kind-registry
  location: MESH_EXTERNAL
  ports:
  - name: http
    number: 5000
    protocol: HTTP
  resolution: DNS
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: blob-istio-io
spec:
  exportTo:
  - "."
  hosts:
  - blob.istio.io
  location: MESH_EXTERNAL
  ports:
  - name: https
    number: 443
    protocol: TLS
  resolution: DNS
---
