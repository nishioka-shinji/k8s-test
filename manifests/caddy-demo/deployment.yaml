apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: caddy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
    spec:
      containers:
      - name: caddy
        image: caddy:2.11.7-alpine
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          tcpSocket:
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /etc/caddy
      volumes:
      - name: config
        configMap:
          name: caddy-config
