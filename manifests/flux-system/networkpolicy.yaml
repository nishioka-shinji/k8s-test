apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone
  namespace: flux-system
spec:
  # ambient では他 namespace からの通信も Pod IP の HBONE ポートに届くが、
  # 生成物の allow-scraping / allow-webhooks は 8080 / 9292 しか許可せず遮断されるため。
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 15008
