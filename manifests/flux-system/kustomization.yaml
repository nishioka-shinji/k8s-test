apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- apps.yaml
- networkpolicy.yaml
patches:
# gotk-components.yaml は flux install の生成物なので、ambient 参加のラベルはここで付ける。
- target:
    kind: Namespace
    name: flux-system
  patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
      labels:
        istio.io/dataplane-mode: ambient
