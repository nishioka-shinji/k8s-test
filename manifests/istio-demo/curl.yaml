apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: istio-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: curl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curl
    spec:
      # 送信側と受信側の ztunnel が別ノードになるよう httpbin と同じノードに置かない。
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: httpbin
            topologyKey: kubernetes.io/hostname
      containers:
      - name: curl
        image: curlimages/curl:8.23.0
        # kubectl exec で httpbin へ curl するための常駐 Pod。
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
