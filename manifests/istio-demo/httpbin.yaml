apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: istio-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: httpbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: httpbin
    spec:
      # curl 側にも同じ指定があり、どちらが先に起動しても別ノードに分かれる。
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: curl
            topologyKey: kubernetes.io/hostname
      containers:
      - name: httpbin
        image: mccutchen/go-httpbin:2.26.0
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /status/200
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: istio-demo
spec:
  selector:
    app.kubernetes.io/name: httpbin
  ports:
  - name: http
    port: 8000
    targetPort: http
