apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: goauthentik
  namespace: authentik
spec:
  interval: 1m0s
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  chart:
    spec:
      chart: authentik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: goauthentik
      version: 2026.8.3
  interval: 1m0s
  # 初回は image pull と migration で既定の 5m を超えることがある
  timeout: 15m0s
  valuesFrom:
  - kind: ConfigMap
    name: authentik-values
    valuesKey: values.yaml
