apiVersion: v1
kind: ConfigMap
metadata:
  name: sinatra-app-code
  namespace: openfeature-demo
data:
  Gemfile: |
    source 'https://rubygems.org'
    gem 'sinatra'
    gem 'puma'
    gem 'rackup'
    gem 'openfeature-sdk'
    gem 'openfeature-flagd-provider'

  app.rb: |
    require 'sinatra'
    require 'open_feature/sdk'
    require 'openfeature/flagd/provider'

    set :bind, '0.0.0.0'
    set :port, 80

    # OpenFeature SDK の設定。同一Pod内の flagd (localhost:8013) を見に行きます。
    OpenFeature::SDK.configure do |config|
      config.set_provider(OpenFeature::Flagd::Provider.build_client)
    end

    FEATURE_CLIENT = OpenFeature::SDK.build_client

    get '/' do
      # フィーチャーフラグ show-welcome-message の評価
      show_welcome = FEATURE_CLIENT.fetch_boolean_value(
        flag_key: 'show-welcome-message',
        default_value: false
      )

      # フラグ値に応じた画面のレンダリング
      if show_welcome
        body = <<~HTML
          <!DOCTYPE html>
          <html>
          <head>
            <title>OpenFeature Sinatra Demo</title>
            <style>
              body { font-family: sans-serif; text-align: center; margin-top: 10%; background-color: #f0fdf4; color: #166534; }
              .card { border: 1px solid #bbf7d0; background: white; padding: 40px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
              h1 { font-size: 2.5em; margin-bottom: 10px; }
              .badge { background-color: #22c55e; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>🎉 Welcome to the Sinatra Demo!</h1>
              <p>フィーチャーフラグによるウェルカムメッセージが表示されています！</p>
              <p><span class="badge">Flag: show-welcome-message is ON</span></p>
            </div>
          </body>
          </html>
        HTML
      else
        body = <<~HTML
          <!DOCTYPE html>
          <html>
          <head>
            <title>OpenFeature Sinatra Demo</title>
            <style>
              body { font-family: sans-serif; text-align: center; margin-top: 10%; background-color: #fcfcfc; color: #475569; }
              .card { border: 1px solid #e2e8f0; background: white; padding: 40px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
              h1 { font-size: 2.5em; margin-bottom: 10px; }
              .badge { background-color: #64748b; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Hello World!</h1>
              <p>標準のメッセージが表示されています（新機能フラグは無効です）。</p>
              <p><span class="badge">Flag: show-welcome-message is OFF</span></p>
            </div>
          </body>
          </html>
        HTML
      end

      body
    end
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: openfeature-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        # OpenFeature Operator に flagd サイドカーを注入するよう指示
        openfeature.dev/enabled: "true"
        openfeature.dev/featureflagsource: "demo-flag-source"
    spec:
      containers:
      - name: app
        image: ruby:3.2
        command: ["/bin/sh", "-c"]
        # 書き込み可能な /myapp ディレクトリを作成し、ConfigMapのシンボリックリンク実体をコピーして起動
        args:
        - |
          mkdir -p /myapp
          cp -L /app-src/Gemfile /myapp/Gemfile
          cp -L /app-src/app.rb /myapp/app.rb
          cd /myapp
          bundle install && bundle exec ruby app.rb
        workingDir: /myapp
        ports:
        - containerPort: 80
        volumeMounts:
        - name: code-volume
          mountPath: /app-src
      volumes:
      - name: code-volume
        configMap:
          name: sinatra-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: openfeature-demo
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: demo-app
