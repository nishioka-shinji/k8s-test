# CRD や webhook を他のアプリが提供するものは、1 つの Kustomization にまとめると dry-run が通らないため、
# 提供元を wait 付きで先に適用し、利用側を dependsOn で後に適用する。
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cert-manager
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openfeature
  namespace: flux-system
spec:
  dependsOn:
  - name: cert-manager
  interval: 10m0s
  path: ./openfeature
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openfeature-demo
  namespace: flux-system
spec:
  dependsOn:
  - name: openfeature
  interval: 10m0s
  path: ./openfeature-demo
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./prometheus
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: imgproxy-2
  namespace: flux-system
spec:
  dependsOn:
  - name: prometheus
  interval: 10m0s
  path: ./imgproxy-2
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
